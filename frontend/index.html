<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="rgb(245 249 252)" />
    <meta name="description" content="Catalyst - learn with momentum." />
    <title>Catalyst Learning</title>
    <script>
      try {
        const validThemes = ["light", "dark"];
        const validPalettes = ["lagoon", "indigo", "ember", "orchid", "graphite"];
        const savedTheme = localStorage.getItem("catalyst-theme");
        const savedPalette = localStorage.getItem("catalyst-palette");
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = validThemes.includes(savedTheme) ? savedTheme : (systemDark ? "dark" : "light");
        document.documentElement.dataset.palette = validPalettes.includes(savedPalette) ? savedPalette : "lagoon";
        const savedText = localStorage.getItem("catalyst-text");
        if (savedText === "large" || savedText === "xlarge") document.documentElement.dataset.text = savedText;
      } catch {
        document.documentElement.dataset.theme = "light";
        document.documentElement.dataset.palette = "lagoon";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="rgb(245 249 252)" />
    <meta name="description" content="Catalyst - learn with momentum." />
    <title>Catalyst Learning</title>
    <script>
      try {
        const key = "catalyst-theme";
        const saved = localStorage.getItem(key);
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = saved || (systemDark ? "dark" : "light");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", saved === "dark" || (!saved && systemDark) ? "rgb(16 42 67)" : "rgb(245 249 252)");
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
